name: Integration Tests

# The legacy localnet integration suites (deploy-pipeline, deploy-all-e2e) were
# decommissioned with the compose localnet stack (DBSF-022): the sandbox now
# runs on the devstack mainnet-fork stack (`pnpm deploy-all` → devstack up +
# the postgres/indexer/server compose remnant). The devstack-up smoke exists
# (`pnpm test:integration devstack-up`) but needs a warm patched fork image —
# a cold CI source build blows its boot budget, so it is local-only for now.
# Fork-stack CI returns with DBSF-024 (devstack/vitest runner) and DBSF-025
# (pinned fork checkpoint + image caching per CI run).

on:
  pull_request:
    paths:
      - "sandbox/**"
      - "external/deepbook/**"
      - ".github/workflows/integration-tests.yml"
  push:
    branches: [main]
    paths:
      - "sandbox/**"
      - "external/deepbook/**"
      - ".github/workflows/integration-tests.yml"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: sandbox/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: sandbox

      - name: Run unit tests
        run: pnpm test:unit
        working-directory: sandbox
