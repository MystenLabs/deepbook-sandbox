# DeepBook Sandbox - Docker Compose (fork-stack remnant, DBSF-022)
#
# The devstack fork stack (`pnpm stack:up` → devstack-plugins/devstack.config.ts)
# owns the chain (sui-fork), funding, and the devstack dashboard. This compose
# file carries only the services devstack does not provide: Postgres, the
# DeepBook indexer, and the DeepBook server.
#
# Usage (scripts/stack.ts — boots devstack detached, then this remnant):
#   pnpm deploy-all               # fork stack + funding + dashboard + remnant
#   pnpm down                     # compose down -v + stop supervisor + wipe
#   docker compose build          # rebuild the indexer/server images explicitly
#
# The indexer ingests checkpoints from the fork over gRPC (sui-fork emits no
# checkpoint files — see scripts/spikes/fork-indexer-checkpoints/SPIKE-NOTES.md).
# Its image is built from docker/deepbook-indexer-fork/ (submodule source +
# rpc-ingestion.patch). Coupling rules:
#   - FIRST_CHECKPOINT must equal the fork checkpoint (FORK_CHECKPOINT pin);
#     fork checkpoints continue mainnet sequence numbers.
#   - Postgres must be wiped (down -v) whenever the fork chain is reset:
#     pipelines resume from committer watermarks and ignore --first-checkpoint.
#   - FORK_RPC_URL defaults to the devstack fork's published host port.
#
# Known gap (follow-up in DBSF-022): deepbook-server's live reads (orderbook,
# DEEP supply, checkpoint lag) use JSON-RPC via sui-sdk, and sui-fork serves
# gRPC only — those endpoints fail against the fork; Postgres-backed endpoints
# work.

networks:
  deepbook-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs

services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: deepbook-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deepbook
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - deepbook-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d deepbook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ============================================================
  # DeepBook Indexer (fork mode)
  # Ingests DeepBook events from the sui-fork chain over gRPC
  # ============================================================
  deepbook-indexer:
    image: ${INDEXER_IMAGE:-mysten/deepbook-sandbox-indexer-fork:local}
    build:
      context: ./docker/deepbook-indexer-fork
      additional_contexts:
        deepbook-src: ../external/deepbook
      args:
        PROFILE: release
        GIT_REVISION: ${GIT_REVISION:-local}
    container_name: deepbook-indexer
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deepbook
      RUST_LOG: ${RUST_LOG:-info}
      # Fork point: checkpoints continue mainnet numbering from here.
      FIRST_CHECKPOINT: ${FORK_CHECKPOINT:-304941000}
      # The devstack sui-fork's published gRPC port on the host.
      RPC_API_URL: ${FORK_RPC_URL:-http://host.docker.internal:51002}
      # Mainnet DeepBook package (originalId — event type tags carry it).
      DEEPBOOK_PACKAGE_ID: ${DEEPBOOK_PACKAGE_ID:-0x2c8d603bc51326b8c13cef9dd07031a408a48dddb541963357661df5d3204809}
      MARGIN_PACKAGES: ${MARGIN_PACKAGES:-}
    ports:
      - "9184:9184" # Prometheus metrics
    networks:
      - deepbook-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9184/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  # ============================================================
  # DeepBook Server (REST API)
  # Serves indexed data from Postgres; live-RPC endpoints are
  # degraded on the fork (JSON-RPC vs gRPC-only fork, see header)
  # ============================================================
  deepbook-server:
    image: ${SERVER_IMAGE:-mysten/deepbookv3-server:46d846e5eea615e0eac94bd801b3e82adbe5cf01-arm64}
    build:
      context: ../external/deepbook
      dockerfile: docker/deepbook-server/Dockerfile
      args:
        PROFILE: release
        GIT_REVISION: ${GIT_REVISION:-local}
    container_name: deepbook-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/deepbook
      RPC_URL: ${FORK_RPC_URL:-http://host.docker.internal:51002}
      DEEPBOOK_PACKAGE_ID: ${DEEPBOOK_PACKAGE_ID:-0x2c8d603bc51326b8c13cef9dd07031a408a48dddb541963357661df5d3204809}
      DEEP_TOKEN_PACKAGE_ID: ${DEEP_TOKEN_PACKAGE_ID:-0xdeeb7a4662eec9f2f3def03fb937a663dddaa2e215b8078a284d026b7946c270}
      DEEP_TREASURY_ID: ${DEEP_TREASURY_ID:-}
      MARGIN_PACKAGE_ID: ${MARGIN_PACKAGE_ID:-0x97d9473771b01f77b0940c589484184b49f6444627ec121314fae6a6d36fb86b}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "9008:9008" # REST API
      # Metrics offset from the indexer's 9184; NOT 9185 — the devstack router
      # pre-claims that port on the host.
      - "9186:9184"
    networks:
      - deepbook-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9008/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
